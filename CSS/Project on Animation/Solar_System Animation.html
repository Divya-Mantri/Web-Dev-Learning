<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <link rel="stylesheet" href="./solar-system animation.css">
</head>
<body>
    <div class="container">
        <div class="orbit">
            <div class="sun">Sun</div>
            <div class="merorbit"></div>
            <div class="mercury">Mercury</div>
            <div class="venorbit"></div>
            <div class="venus">Venus</div>
            <div class="earorbit"></div>
            <div class="earth">Earth</div>
            <div class="marorbit"></div>
            <div class="mars">Mars</div>
            <div class="juporbit"></div>
            <div class="jupiter">Jupiter</div>
            <div class="satorbit"></div>
            <div class="saturn">Saturn</div>
            <div class="urorbit"></div>
            <div class="uranus">Uranus</div>
            <div class="neporbit"></div>
            <div class="neptune">Neptune</div>
            <div class="stars s1"></div>
            <div class="stars s2"></div>
            <div class="stars s3"></div>
            <div class="stars s4"></div>
            <div class="stars s5"></div>
            <div class="stars s6"></div>
            <div class="stars s7"></div>
            <div class="stars s8"></div>
            <div class="stars s9"></div>
            <div class="stars s10"></div>

        </div>
    </div>
</body>
</html>
