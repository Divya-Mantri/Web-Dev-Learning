<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book My Show</title>
    <link rel="stylesheet" href="./bookmyshow.css">
</head>
<body>
    <header>
        <div class="head">
            <div class="logo">
                <div class="left">
                    <h1>BookMyShow</h1>
                </div>
                <div class="right">
                    <button>Movies</button>
                    <button>Events</button>
                    <button>Sports</button>
                    <button>More</button>
                </div>
            </div>
            <div class="search">
                <input type="text" class="searching" placeholder="search for movies, events and sports...">
                <button>Search</button>
            </div>
    </header>
    <main>
        <div class="hero">
            <h2>Experience the Best Movies and Events</h2>
            <button>Book Now</button>
        </div>
        <div class="mover">
            <h2>Popular Movies</h2>
        </div>
        <div class="movie">
            <div class="card">
                <img src="./img1.avif" alt="Singham" class="images">
                <h3>Singham</h3>
            </div>
            <div class="card">
                <img src="./img2.avif" alt="Bhool Bhulaiya" class="images">
                <h3>Bhool Bhulaiya</h3>
            </div>
            <div class="card">
                <img src="./img3.avif" alt="Venom" class="images">
                <h3>Venom</h3>
            </div>
            <div class="card">
                <img src="./img4.avif" alt="Vicky Vidhya" class="images">
                <h3>Vicky Vidhya</h3>
            </div>
            <div class="card">
                <img src="./img5.avif" alt="Jigra" class="images">
                <h3>Jigra</h3>
            </div>
            <div class="card">
                <img src="./img6.avif" alt="Chaudhary" class="images">
                <h3>Chaudhary</h3>
            </div>
            <div class="card">
                <img src="./img7.avif" alt="Amaram" class="images">
                <h3>Amaran</h3>
            </div>
            <div class="card">
                <img src="./mg8.avif" alt="The Wild Robot" class="images">
                <h3>The Wild Robot</h3>
            </div>
        </div>
        <div class="bot">
            <img src="./bottom.avif" alt="bottom">
        </div>
    </main>
</body>
</html>
