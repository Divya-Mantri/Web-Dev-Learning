<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Health Details Form</h1>

    <fieldset>
        <legend>Personal Information</legend>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="Full Name">
        <br>
        <br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="DOB" max="2025-06-25" min="2000-01-01">
        <br>
        <br>
        <label for="gen">Gender:</label>
        <select name="Gender" id="gen">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <br>
        <br>
        <label for="phn">Phone Number:</label>
        <input type="tel" id="phn" name="Contact">
        </fieldset>
        <br>
        <br>

        <fieldset>
            <legend>Medical History</legend>
            <label for="bg">Blood Group:</label>
            <select name="Blood Group" id="bg">
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
            <br>
            <br>
            <label>Do you wear glasses or contact lenses?</label>
            <br>
            <input type="radio" id="yes" value="Yes" name="Glasses/Lenses">
            <label for="yes">Yes</label>
        
            <input type="radio" id="no" value="No" name="Glasses/Lenses">
            <label for="no">No</label>
            <br>
            <br>

            <label for="history">Pre-existing Conditions:</label>
            <br>
            <textarea id="history" name="Pre-existing Conditions" rows="3" cols="50" placeholder="List any current medications"></textarea>
            </textarea>
            <br>
            <br>
            <label>Allergies:</label>
            <br>
            <input type="checkbox" id="pollen" value="Pollen" name="Allergies">
            <label for="pollen">Pollen</label> <br>
            <input type="checkbox" id="peanuts" value="Peanuts" name="Allergies">
            <label for="peanuts">Peanuts</label> <br>
            <input type="checkbox" id="latex" value="Latex" name="Allergies">
            <label for="latex">Latex</label> <br>
            <input type="checkbox" id="none" value="None" name="Allergies">
            <label for="none">None</label> <br>
            <br>
            <label for="current_med">Current Medications:</label> <br>
            <textarea name="Current Medications" id="current_med" placeholder="List any current medications" rows="4" cols="50"></textarea>
            <br><br>
        </fieldset>

        <fieldset>
            <legend>Emergency Contact</legend>

            <label for="ec_name">Emergency Contact Name:</label>
            <input type="text" id="ec_name" name="Emergency_Contact_Name">
            <br><br></br>
            <label for="ec_phone">Emergency Contact Phone:</label>
            <input type="tel" id="ec_phone" name="Emergency_Contact">
            <br><br></br>
            <label for="rel">Relationship to Emergency Contact:</label>
            <input type="text" id="rel" name="Relationship_Emergency">
            <br><br></br>
        </fieldset>

        <button>Submit</button>
</body>
</html>
